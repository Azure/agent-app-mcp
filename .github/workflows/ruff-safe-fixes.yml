name: Generate reviewed safe Ruff fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  safe-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned tools
        id: restore
        run: |
          python3.12 -m venv .ci-tools
          .ci-tools/bin/python -m pip install --disable-pip-version-check uv==0.10.12
          .ci-tools/bin/uv sync --frozen --no-install-project --python python3.12
      - name: Generate only supported safe fixes
        run: .venv/bin/ruff check --fix --no-unsafe-fixes --select I001,SIM117,PLR0402 src tests
      - name: Preserve proposed changes for review
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          python3.12 - <<'PY'
          import base64
          import json
          import pathlib
          import subprocess

          names = subprocess.check_output(
              ["git", "diff", "--name-only", "--", "src", "tests"], text=True
          ).splitlines()
          result = {
              name: base64.b64encode(pathlib.Path(name).read_bytes()).decode()
              for name in names
          }
          pathlib.Path("ruff-safe-fixes.json").write_text(json.dumps(result))
          subprocess.run(["git", "diff", "--", "src", "tests"], check=True)
          PY
      - name: Upload review artifact
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ruff-safe-fixes
          path: ruff-safe-fixes.json
          if-no-files-found: error
          retention-days: 1
