name: Quality gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container locally
        timeout-minutes: 2
        run: docker build --file Dockerfile --tag nl2sql-mcp:ci .

  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned resolver
        run: |
          python3.12 -m venv .ci-tools
          .ci-tools/bin/python -m pip install --disable-pip-version-check uv==0.10.12
      - name: Verify lock and restore runtime and development dependencies
        id: restore
        run: |
          .ci-tools/bin/uv lock --python python3.12 --upgrade-package cryptography --upgrade-package starlette
          .ci-tools/bin/uv lock --check --python python3.12
          .ci-tools/bin/uv sync --frozen --no-install-project --python python3.12
      - name: Capture regenerated public dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-dependency-lock
          path: uv.lock
          retention-days: 1
      - name: Check Python lint
        run: .venv/bin/ruff check src tests
      - name: Run maintained contract tests
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: .venv/bin/python -m pytest -q tests

  agentic-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned validator dependencies
        run: python -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt
      - name: Validate agents, skills, and scoped instructions
        run: python .github/scripts/validate-agentic-assets.py
      - name: Compile validator
        run: python -m compileall -q .github/scripts

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [build, python-tests, agentic-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every prerequisite to succeed
        shell: python
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = {"agentic-assets", "build", "python-tests"}
          if set(needs) != expected or any(
              job.get("result") != "success" for job in needs.values()
          ):
              sys.exit(f"Quality gate prerequisites did not all succeed: {needs}")
