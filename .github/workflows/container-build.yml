name: Verify container build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build container locally
        if: github.head_ref != 'release/2.0.0'
        timeout-minutes: 2
        run: docker build --file Dockerfile --tag nl2sql-mcp:ci .
      - name: Generate the release lock with the pinned package manager
        if: github.head_ref == 'release/2.0.0'
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src ghcr.io/astral-sh/uv:0.10.12 lock --python 3.12
      - name: Upload the generated release lock
        if: github.head_ref == 'release/2.0.0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-v2-release-lock
          path: uv.lock
      - name: Build the release container locally
        if: github.head_ref == 'release/2.0.0'
        timeout-minutes: 2
        run: docker build --file Dockerfile --tag nl2sql-mcp:ci .
