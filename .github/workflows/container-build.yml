name: Verify container build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate targeted official-PyPI lock
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://pypi.org/simple uv==0.10.12
          uv lock --python /usr/bin/python3.12 --default-index https://pypi.org/simple \
            --upgrade-package 'certifi==2026.10.19' \
            --upgrade-package 'pyjwt==2.15.0' \
            --upgrade-package 'urllib3==2.8.0' \
            --upgrade-package 'anyio==4.14.2'
      - name: Test updated authentication and protocol behavior
        run: |
          uv sync --frozen --default-index https://pypi.org/simple
          uv run --frozen pytest tests/test_auth_protocol.py -q
      - name: Upload generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-maintenance-lock
          path: uv.lock
          retention-days: 1
          if-no-files-found: error
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build container locally
        timeout-minutes: 2
        run: docker build --file Dockerfile --tag nl2sql-mcp:ci .
