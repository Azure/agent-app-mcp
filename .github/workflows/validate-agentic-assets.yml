name: Validate agentic engineering assets

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/validate-agentic-assets.py"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/validate-agentic-assets.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/validate-agentic-assets.py"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/validate-agentic-assets.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned validator dependencies
        run: python -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt
      - name: Validate agents, skills, and scoped instructions
        run: python .github/scripts/validate-agentic-assets.py
      - name: Compile validator
        run: python -m compileall -q .github/scripts
