name: Release branch guard

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  release-branch-required:
    name: release-branch-required
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate release source repository and branch
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]] ||
             [[ ! "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only same-repository release/X.Y.Z branches may target main."
            exit 1
          fi
